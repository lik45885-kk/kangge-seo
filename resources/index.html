<!doctype html>
<html lang="zh-CN">
<head>

  <style>
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:#fff;color:#302640;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.7}
    a{text-decoration:none;color:inherit}
    .wrap{width:min(1120px,calc(100% - 64px));margin:auto}
    .topbar{height:84px;border-bottom:1px solid #f0ebf5;background:#fff}
    .topbar .wrap{height:100%;display:flex;align-items:center;justify-content:space-between;gap:24px}
    .brand{display:block;white-space:nowrap}
    .brand strong{display:block;font-size:20px;letter-spacing:-.04em}
    .brand small{display:block;font-size:10px;letter-spacing:.08em;color:#9987ad}
    .site-nav{display:flex;align-items:center;gap:32px;white-space:nowrap}
    .site-nav a{font-size:14px;color:#796b88;transition:color .2s}
    .site-nav a:hover,.site-nav a[aria-current="page"]{color:#7851ba}
    .site-nav a[aria-current="page"]{font-weight:600}
    .hero{min-height:calc(100vh - 150px);display:flex;align-items:center;background:linear-gradient(120deg,#faf5ff,#f3efff 60%,#f9edf4)}
    .hero .wrap{padding-top:100px;padding-bottom:110px}
    .kicker{font-size:12px;font-weight:600;letter-spacing:.12em;color:#8b61e7}
    h1{font-size:clamp(40px,6vw,64px);line-height:1.2;letter-spacing:-.05em;margin:18px 0 18px;font-weight:650}
    p{font-size:16px;color:#777181;max-width:620px;margin:0;line-height:1.95}
    .actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:34px}
    .btn{min-height:46px;padding:11px 24px;border-radius:99px;background:linear-gradient(110deg,#ef799e,#a974ea 48%,#80bdf6);color:white;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center}
    .btn.secondary{background:#fff;color:#65507f;border:1px solid #ddd2ed}
    footer{padding:22px 0;border-top:1px solid #eee8f5;font-size:12px;color:#9987ad}
    a:focus-visible{outline:3px solid #c8b4f2;outline-offset:5px}
    @media(max-width:560px){.wrap{width:calc(100% - 36px)}.topbar{height:72px}.brand strong{font-size:17px}.brand small{display:none}.site-nav{gap:13px}.site-nav a{font-size:12px}.hero .wrap{padding-top:80px;padding-bottom:90px}p{font-size:14px}}
  </style>
</head>
<body>
  <header class="topbar"><div class="wrap">
    <a class="brand" href="../" aria-label="康哥亲投，返回首页"><strong>康哥亲投</strong><small>亲自操盘 · 不转手</small></a>

      <a href="./" aria-current="page">资源中心</a>
      <a href="../#contact">联系我</a>
    </nav>
  </div></header>
  <main class="hero">
    <div class="wrap">
      <span class="kicker">RESOURCES · 资源中心</span>
      <h1>资源中心</h1>
      <p>这里将陆续整理百度推广账户优化、关键词与搜索词分析、落地页优化及SEM实操经验。内容准备好后会逐步更新。</p>
      <div class="actions"><a class="btn" href="../">返回首页</a><a class="btn secondary" href="../#contact">联系我</a></div>
    </div>

  <footer><div class="wrap">康哥亲投 · 百度推广代运营与搜索广告优化</div></footer>
</body>
</html>
