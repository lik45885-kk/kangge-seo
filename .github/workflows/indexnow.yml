name: Notify IndexNow after Pages publication

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "resources/**"
      - "about/**"
      - "contact/**"
      - "sitemap.xml"
      - ".github/workflows/indexnow.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Check out published sources
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - name: Notify IndexNow of canonical URLs
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/submit_indexnow.py
